name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n1)
          echo "sdkmanager: $SDKMGR"
          echo "SDKMANAGER=$SDKMGR" >> "$GITHUB_ENV"

      - name: Accept licenses and install platform 36
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" || echo "::warning::platforms;android-36 install failed, letting AGP try"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
